# Edge proxy for Sureshot: TLS, static web app, API + WebSocket proxy, edge rate limits.
# Mounted into the nginx container by infra/docker-compose.production.yml.
# Replace shop.example.com and provide certificates (for example from Lets Encrypt) before use.

# Docker's embedded DNS returns every API replica; re-resolve so scaling up/down needs no restart.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name shop.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name shop.example.com;

  ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;

  client_max_body_size 2m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  limit_conn perip 60;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets: cache for a year.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires 1d; }

  # Credential endpoints get an extra, tighter edge limit (the API also limits per account).
  location ~ ^/api/v1/(auth/login|auth/register|delivery/apply) {
    limit_req zone=login burst=20 nodelay;
    set $api http://api:4300;
    proxy_pass $api;
    include /etc/nginx/proxy_params.conf;
  }

  location /api/ {
    limit_req zone=api burst=120 nodelay;
    set $api http://api:4300;
    proxy_pass $api;
    include /etc/nginx/proxy_params.conf;
  }

  # WebSocket only (the client forces the websocket transport), so no sticky routing is needed:
  # rooms are shared across replicas through the Redis adapter.
  location /socket.io/ {
    set $api http://api:4300;
    proxy_pass $api;
    include /etc/nginx/proxy_params.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }

  location = /healthz { access_log off; set $api http://api:4300; proxy_pass $api; }

  # Single-page app: unknown paths fall back to index.html, which is never cached.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
